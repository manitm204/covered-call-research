[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xsp-research"
version = "0.1.0"
description = "Research and backtesting framework for XSP bear call credit spread overlay strategies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "polars>=1.0",
    "duckdb>=1.0",
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "xgboost>=2.0", "lightgbm>=4.0", "optuna>=3.5"]
viz = ["matplotlib>=3.8", "plotly>=5.18"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
xsp = "xsp_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:xsp_research.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
