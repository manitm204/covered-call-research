# Experiment 3 (research brief section 15): VIX-level entry filter.
# Hypothesis under test (not assumed): entering only in calm regimes changes
# the net-of-cost expectancy vs the mechanical baseline.
name: spy_vix_below_20
strategy_config: configs/strategy_spy_baseline.yaml
scenarios: [base, conservative]
feature_families: [volatility, trend, breadth, cross_asset, pca_regime]
entry_filters:
  - feature: vix_level
    op: "<"
    value: 20.0
allow_entry_on_missing_feature: false
capture_entry_features: true
