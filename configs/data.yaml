# Data source configuration (Phase 1: file-based providers only).
# Provider-specific adapters (ThetaData, Polygon, Cboe DataShop, ORATS) arrive
# in Phase 2 and normalize into the canonical schema in docs/PLAN.md.
options:
  provider: user_parquet
  path: data/normalized/options
  root: XSP
underlying:
  provider: user_file
  path: data/normalized/underlying/xsp.parquet
  symbol: XSP
rates:
  provider: user_file
  path: data/normalized/rates/tbill_4w.parquet
# Licensing note: options quote data is licensed by its vendor; do not commit
# any data files to this repository (enforced via .gitignore).
