# Transaction-cost reference used by execution scenarios (documented assumptions).
# Verify against your broker's actual schedule before interpreting net results.
#
# commission_per_contract: broker commission (e.g. $0.65 typical retail tier)
# fees_per_contract: exchange proprietary-product fee + ORF + SEC/TAF estimate
#   XSP is a Cboe proprietary index product; fees differ from equity options.
scenarios:
  optimistic:
    commission_per_contract: 0.50
    fees_per_contract: 0.45
    fill: midpoint
  base:
    commission_per_contract: 0.65
    fees_per_contract: 0.60
    fill: 50% between natural and midpoint
  conservative:
    commission_per_contract: 1.00
    fees_per_contract: 0.75
    fill: natural plus $0.02/spread slippage
