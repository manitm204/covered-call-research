# SPY bear call credit spread baseline (American-style, physically settled).
# Differences from the XSP baseline are the contract mechanics: the engine
# models dividend-driven early assignment and force-closes on expiry day
# instead of cash-settling. Requires SPY_DIVIDENDS.parquet (xsp ingest-aux).
name: baseline_spy_bear_call

selection:
  root: SPY
  exercise_style: american
  settlement: physical
  target_dte: 30
  min_dte: 25
  max_dte: 35
  short_delta_target: 0.15
  width_method: fixed_width
  fixed_width: 5.0
  min_short_bid: 0.05
  max_leg_rel_spread: 0.50

exits:
  - kind: profit_target
    profit_target_pct: 0.50
  - kind: stop_loss
    stop_loss_multiple: 2.0

execution:
  fill_model: pct_between
  fill_pct: 0.5
  slippage_per_spread: 0.0
  max_leg_rel_spread: 0.50
  min_credit: 0.05

costs:
  commission_per_contract: 0.65
  fees_per_contract: 0.10   # SPY options: ORF/OCC/SEC only, no index-product fee
  settlement_fee_per_contract: 0.0

interest:
  mode: free_cash_only
  rate_source: provider
  spread_bps: -25

sizing:
  contracts_per_entry: 1
  max_open_positions: 2

backtest:
  start: 2018-08-01
  end: 2026-07-22
  initial_cash: 100000.0
  entry_frequency: monthly
  entry_time_et: "15:30:00"
  mark_time_et: "15:30:00"
